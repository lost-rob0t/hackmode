name: agent-pr-serialization

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agent-pr-serialization
  cancel-in-progress: false

env:
  # close-old: newest configured agent PR wins.
  # refuse-new: oldest configured agent PR keeps the lane.
  AGENT_PR_POLICY: ${{ vars.AGENT_PR_POLICY || 'close-old' }}

jobs:
  serialize:
    name: one-open-pr-per-agent-lane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce configured Agent Zero PR lanes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          # Forgejo sets GITHUB_API_URL to the instance v1 API and GITHUB_TOKEN
          # to the job token. The gh CLI is not dependable on this runner, so
          # every call below uses the standard library only.
          api = os.environ.get("GITHUB_API_URL", "").rstrip("/")
          if not api:
              api = os.environ["GITHUB_SERVER_URL"].rstrip("/") + "/api/v1"
          repo = os.environ["GITHUB_REPOSITORY"]
          policy = os.environ.get("AGENT_PR_POLICY", "close-old").strip()
          token = os.environ.get("GITHUB_TOKEN", "")

          if policy not in {"close-old", "refuse-new"}:
              print(f"::error::Unsupported AGENT_PR_POLICY={policy!r}; use close-old or refuse-new")
              raise SystemExit(2)

          current_pr = None
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as fh:
                  event = json.load(fh)
              if event.get("pull_request"):
                  current_pr = event.get("number")

          def request(path, method="GET", body=None):
              url = api + path
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              if token:
                  req.add_header("Authorization", "token " + token)
              req.add_header("Accept", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
              except urllib.error.HTTPError as err:
                  detail = err.read().decode("utf-8", "replace")[:400]
                  print(f"::error::{method} {path} -> HTTP {err.code}: {detail}")
                  raise SystemExit(2)
              if not raw:
                  return None
              return json.loads(raw.decode("utf-8"))

          def fetch_open_pulls():
              pulls = []
              page = 1
              while True:
                  batch = request(
                      f"/repos/{repo}/pulls?state=open&base=master&limit=50&page={page}"
                  )
                  if not batch:
                      break
                  pulls.extend(batch)
                  if len(batch) < 50:
                      break
                  page += 1
              return pulls

          lanes_doc = request(f"/repos/{repo}/contents/agent-zero/pr-lanes.txt")
          lane_text = base64.b64decode(lanes_doc.get("content", "")).decode("utf-8")
          lanes = tuple(
              line.strip()
              for line in lane_text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          if not lanes:
              print("::error::agent-zero/pr-lanes.txt contains no branch-prefix lanes")
              raise SystemExit(2)

          # Only same-repository agent branches are eligible. Fork PRs and
          # unrelated human branches are deliberately untouched.
          pulls = [
              pr
              for pr in fetch_open_pulls()
              if (pr.get("head") or {}).get("repo", {}).get("full_name") == repo
          ]

          closed = []

          for lane in lanes:
              lane_pulls = [pr for pr in pulls if pr["head"]["ref"].startswith(lane)]
              if len(lane_pulls) <= 1:
                  continue

              lane_pulls.sort(key=lambda pr: (pr["created_at"], pr["number"]))
              keep = lane_pulls[-1] if policy == "close-old" else lane_pulls[0]

              for pr in lane_pulls:
                  if pr["number"] == keep["number"]:
                      continue

                  if policy == "close-old":
                      body = (
                          f"Agent PR serialization closed this PR because "
                          f"#{keep['number']} is the newer open `{lane}` lane PR. "
                          "One open PR per configured agent lane is allowed."
                      )
                  else:
                      body = (
                          f"Agent PR serialization rejected this PR because "
                          f"#{keep['number']} already owns the open `{lane}` lane. "
                          "Finish or close that PR before opening another."
                      )

                  request(f"/repos/{repo}/issues/{pr['number']}/comments",
                          method="POST", body={"body": body})
                  request(f"/repos/{repo}/pulls/{pr['number']}",
                          method="PATCH", body={"state": "closed"})
                  closed.append(pr["number"])
                  print(f"closed #{pr['number']} in {lane}; keeping #{keep['number']} ({policy})")

          remaining = [
              pr
              for pr in fetch_open_pulls()
              if (pr.get("head") or {}).get("repo", {}).get("full_name") == repo
          ]

          violations = []
          for lane in lanes:
              nums = [pr["number"] for pr in remaining if pr["head"]["ref"].startswith(lane)]
              if len(nums) > 1:
                  violations.append((lane, nums))

          if violations:
              for lane, nums in violations:
                  print(f"::error::{lane} still has multiple open PRs: {nums}")
              raise SystemExit(1)

          if current_pr in closed:
              print(f"::error::PR #{current_pr} was closed by agent PR policy {policy}")
              raise SystemExit(1)

          print(f"Agent PR serialization satisfied with policy={policy}")
          PY
