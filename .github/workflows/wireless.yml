name: wireless-tools

on:
  push:
    paths:
      - tools/wireless/**
      - .github/workflows/wireless.yml
  pull_request:
    paths:
      - tools/wireless/**
      - .github/workflows/wireless.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: wireless-python-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Hackmode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wireless tools (editable with dev extras)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'tools/wireless[dev]'

      - name: Ruff
        working-directory: tools/wireless
        run: ruff check .

      - name: Mypy
        working-directory: tools/wireless
        run: mypy

      - name: Pytest
        working-directory: tools/wireless
        run: pytest -q
