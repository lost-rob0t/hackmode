name: core

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: common-lisp-core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Hackmode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout pinned Tek9
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lost-rob0t/tek9
          ref: 6ff2e40a6f7e3a5eadafef94c2779c74566b7fd7
          path: deps/tek9-ci
          fetch-depth: 1

      - name: Checkout pinned StarIntel Common Lisp schema
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lost-rob0t/star-cl
          ref: b8dfbe2f9f56065ace8c3313b92ca748a115cdfa
          path: deps/star-cl-ci
          fetch-depth: 1

      - name: Checkout pinned Sento actor runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deps/sento-ci
          git clone --filter=blob:none --no-checkout \
            https://github.com/mdbergmann/cl-gserver.git \
            deps/sento-ci
          git -C deps/sento-ci fetch --depth=1 origin \
            6a510c5b58469e72e6363bd3a6059d80b9a5c320
          git -C deps/sento-ci checkout --detach \
            6a510c5b58469e72e6363bd3a6059d80b9a5c320
          test -f deps/sento-ci/sento.asd

      - name: Checkout pinned cms-ulid
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://gitlab.com/colinstrickland/cms-ulid.git \
            deps/cms-ulid-ci
          git -C deps/cms-ulid-ci fetch --depth=1 origin \
            fff84302dee5db42fb90aafd834af3ffbfd6c2bb
          git -C deps/cms-ulid-ci checkout --detach \
            fff84302dee5db42fb90aafd834af3ffbfd6c2bb

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sbcl \
            swi-prolog-nox \
            liblmdb-dev \
            libffi-dev \
            libssl-dev \
            curl

      - name: Install Quicklisp
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/quicklisp.lisp" \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
            --load "$RUNNER_TEMP/quicklisp.lisp" \
            --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))'

      - name: Load Hackmode and run ASDF tests
        shell: bash
        run: |
          set -euo pipefail
          sbcl --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(push (truename "deps/cms-ulid-ci/") asdf:*central-registry*)' \
            --eval '(push (truename "deps/sento-ci/") asdf:*central-registry*)' \
            --eval '(asdf:load-asd (truename "deps/tek9-ci/src/tek9.asd"))' \
            --eval '(asdf:load-asd (truename "deps/star-cl-ci/src/starintel.asd"))' \
            --eval '(asdf:load-asd (truename "deps/sento-ci/sento.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-core/hackmode.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-core/hackmode-tests.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-database/hackmode-database.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-database/hackmode-database-tests.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-providers/dns/hackmode-provider-dns.asd"))' \
            --eval '(asdf:load-asd (truename "source/hackmode-providers/dns/hackmode-provider-dns-tests.asd"))' \
            --eval '(ql:quickload :hackmode-tests)' \
            --eval '(ql:quickload :hackmode-database-tests)' \
            --eval '(ql:quickload :hackmode-provider-dns-tests)' \
            --eval '(asdf:test-system :hackmode)' \
            --eval '(asdf:test-system :hackmode-database)' \
            --eval '(asdf:test-system :hackmode-provider-dns)' \
            2>&1 | tee "$RUNNER_TEMP/hackmode-core.log"

      - name: Upload Common Lisp diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackmode-core-log
          path: ${{ runner.temp }}/hackmode-core.log
          if-no-files-found: warn
          retention-days: 3
